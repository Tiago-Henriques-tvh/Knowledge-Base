name: Enterprise Production Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force-deploy:
        description: "Bypass staging deploy checks?"
        type: boolean
        default: false

# Least-privilege principle: global permissions set to read-only
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Parallel Matrix Build & Test using Composite Action
  # ------------------------------------------------------------------
  build-and-test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Allow other matrix jobs to complete even if one fails
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20]
        exclude:
          # Exclude legacy node on Windows
          - os: windows-latest
            node-version: 18
        include:
          # Inject experimental runner combination
          - os: ubuntu-latest
            node-version: 22
            experimental: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Invoke local Composite Action
      - name: Run Local Composite Action
        id: composite-build
        uses: ./.github/actions/build-and-test
        with:
          node-version: ${{ matrix.node-version }}
          environment: "staging"
          enable-security-scan: "true"

      - name: Log Composite Output Values
        run: |
          echo "Generated Artifact Name: ${{ steps.composite-build.outputs.build-artifact-name }}"
          echo "Cache Hit Status: ${{ steps.composite-build.outputs.cache-hit }}"

  # ------------------------------------------------------------------
  # JOB 2: Secure OIDC Cloud Deployment & Package Publishing
  # ------------------------------------------------------------------
  deploy-cloud:
    name: Deploy to AWS & Publish Package
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # Elevated permissions required for OIDC token generation and GitHub Packages publishing
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication
      packages: write # Required for GitHub Packages publishing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. AWS OIDC Authentication (No long-lived access keys)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsCloudDeploy
          aws-region: us-east-1

      # 2. Authenticate to GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Packages Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build & Publish Container Image
      - name: Build and Push Docker Image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          # Normalize image name to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker build -t $IMAGE_ID .
          docker push $IMAGE_ID
